<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SEGPA Jean Vilar</title>
<meta name="description" content="La SEGPA du Collège Jean Vilar à Grigny : présentation, équipe, ateliers et réalisations de l'atelier Habitat.">
<!-- Site non référencé par les moteurs de recherche tant que la direction n'a pas validé la publication. Supprimer la ligne suivante pour le rendre visible sur Google. -->
<meta name="robots" content="noindex, nofollow">
<style>[hidden]{display:none!important}img{max-width:100%}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@112,500;112,700;125,800&family=Public+Sans:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=Caveat:wght@500;700&display=swap">
<style>
/* =========== Jetons communs (style A par défaut) =========== */
:root{
  --bg:#EBEDEC; --surface:#F8F9F8; --ink:#1A1E21; --ink-2:#4A5157; --line:#C9CFCD;
  --accent:#2150B8; --accent-ink:#FFFFFF; --pop:#B97A12; --ok:#2F7D4F; --ph-a:#DCE3E8; --ph-b:#C4CFD7;
  --display:"Archivo","Arial Narrow",Arial,sans-serif; --body:"Public Sans",system-ui,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace; --hand:"Caveat","Comic Sans MS",cursive;
  --radius:2px; --stretch:125%;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){color-scheme:dark;
    --bg:#15191C; --surface:#1D2226; --ink:#E6EAEC; --ink-2:#A3ACB2; --line:#343C42;
    --accent:#7CA2F2; --accent-ink:#0E1114; --pop:#E0A640; --ok:#6BC291; --ph-a:#222A31; --ph-b:#2C363F;}
}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#15191C; --surface:#1D2226; --ink:#E6EAEC; --ink-2:#A3ACB2; --line:#343C42;
  --accent:#7CA2F2; --accent-ink:#0E1114; --pop:#E0A640; --ok:#6BC291; --ph-a:#222A31; --ph-b:#2C363F;}

/* Style B — Atelier : couleurs des bleus de travail, jaune signalétique, rouge fuselage */
body.s-b{color-scheme:light;
  --bg:#FFFFFF; --surface:#FFFFFF; --ink:#101828; --ink-2:#3E4A5C; --line:#101828;
  --accent:#1F4FD1; --accent-ink:#FFFFFF; --pop:#FFC928; --red:#E0442F; --ok:#1E9E5A; --ph-a:#E8EEFF; --ph-b:#C9D6FF;
  --display:"Bricolage Grotesque","Arial Black",Arial,sans-serif; --body:"Atkinson Hyperlegible",Verdana,sans-serif; --radius:14px;}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.6 var(--body);padding-inline:clamp(16px,4vw,48px);padding-block:0 48px;margin:0}
a{color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.wrap{max-width:1180px;margin-inline:auto}
.mono{font-family:var(--mono);font-size:.78rem;letter-spacing:.02em}
.label{font-family:var(--mono);font-size:.72rem;text-transform:uppercase;letter-spacing:.12em;color:var(--ink-2)}
body.s-b .label{font-family:var(--body);font-weight:700;letter-spacing:.08em;color:var(--accent)}


/* ---------- En-tête ---------- */
header.site{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px;padding-block:22px;border-bottom:1px solid var(--line)}
body.s-b header.site{border-bottom:3px solid var(--ink)}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none}
.brand-mark{width:38px;height:38px;display:grid;grid-template-columns:repeat(3,1fr);gap:2px;flex:none}
.brand-mark span{background:var(--ink)}
.brand-mark span:nth-child(5){background:var(--accent)}
body.s-b .brand-mark span:nth-child(1),body.s-b .brand-mark span:nth-child(9){background:var(--pop)}
body.s-b .brand-mark span:nth-child(3){background:var(--red)}
body.s-b .brand-mark span{border-radius:3px}
.brand-txt b{display:block;font-family:var(--display);font-stretch:var(--stretch);font-weight:800;font-size:1.05rem;line-height:1.1;text-transform:uppercase}
body.s-b .brand-txt b{text-transform:none;font-size:1.3rem}
.brand-txt small{font-size:.8rem;color:var(--ink-2)}
nav.main{display:flex;flex-wrap:wrap;gap:4px}
nav.main a{text-decoration:none;padding:8px 12px;font-weight:700;font-size:.92rem;border-radius:var(--radius)}
nav.main a[aria-current="page"]{background:var(--ink);color:var(--bg)}
body.s-b nav.main a{border:2px solid transparent;border-radius:999px}
body.s-b nav.main a[aria-current="page"]{background:var(--pop);color:var(--ink);border-color:var(--ink)}

/* ---------- Accueil ---------- */
.hero{display:grid;grid-template-columns:1.15fr 1fr;gap:clamp(24px,4vw,56px);align-items:center;padding-block:clamp(32px,5vw,64px) 36px}
.hero h1{font-family:var(--display);font-stretch:var(--stretch);font-weight:800;font-size:clamp(2.2rem,5.2vw,4.2rem);line-height:.98;margin:8px 0 20px;text-transform:uppercase;text-wrap:balance}
.hero h1 em{font-style:normal;color:var(--accent)}
body.s-b .hero h1{text-transform:none;line-height:1.02;letter-spacing:-.02em}
body.s-b .hero h1 em{color:var(--ink);background:var(--pop);padding:0 .15em;border-radius:10px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.hero p{max-width:56ch;margin:0 0 24px;color:var(--ink-2);font-size:1.06rem}
.hero-photo{margin:0;position:relative}
.hero-photo img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;background:var(--ph-a)}
.hero-photo figcaption{font-size:.82rem;color:var(--ink-2);padding-top:8px}
body.s-b .hero-photo img{border:3px solid var(--ink);border-radius:var(--radius);box-shadow:8px 8px 0 var(--accent)}
body.s-b .hero-photo .sticker{position:absolute;top:-14px;right:-8px;transform:rotate(6deg)}
.sticker{display:none}
body.s-b .sticker{display:inline-block;background:var(--red);color:#fff;font-family:var(--display);font-weight:800;padding:8px 14px;border:3px solid var(--ink);border-radius:999px;font-size:.95rem}
.stats{display:grid;grid-template-columns:repeat(3,1fr);border-top:2px solid var(--ink)}
.stats div{padding:14px 12px 0 0}
.stats b{display:block;font-family:var(--display);font-stretch:112%;font-weight:700;font-size:2rem;line-height:1;font-variant-numeric:tabular-nums}
.stats span{font-size:.82rem;color:var(--ink-2)}
body.s-b .stats{border:0;gap:10px}
body.s-b .stats div{padding:12px;border:3px solid var(--ink);border-radius:var(--radius)}
body.s-b .stats div:nth-child(1){background:var(--pop)}
body.s-b .stats div:nth-child(2){background:var(--accent);color:#fff}
body.s-b .stats div:nth-child(2) span{color:#E4EAFF}
body.s-b .stats div:nth-child(3){background:var(--red);color:#fff}
body.s-b .stats div:nth-child(3) span{color:#FFE4DF}

/* filtres */
.filters{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:end;padding:18px 0;border-block:1px solid var(--line);margin-bottom:28px}
body.s-b .filters{border:3px solid var(--ink);border-radius:var(--radius);padding:16px;background:var(--ph-a)}
.filters label{display:grid;gap:4px;min-width:0}
.filters select{font:inherit;font-size:.92rem;padding:8px 32px 8px 10px;max-width:100%;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:var(--radius)}
body.s-b .filters select{border:2px solid var(--ink);border-radius:10px;font-weight:700}
.filters .count{margin-left:auto;align-self:center}
button.reset{font:inherit;font-size:.85rem;background:none;border:0;color:var(--accent);text-decoration:underline;cursor:pointer;padding:8px 0}

/* cartes */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,440px),1fr));gap:32px}
.card{display:flex;flex-direction:column;text-decoration:none;background:var(--surface);border:1px solid var(--line);transition:transform .2s ease,box-shadow .2s ease}
.card-media{aspect-ratio:16/10;overflow:hidden;position:relative;background:var(--ph-a)}
.card-media canvas,.card-media img{width:100%;height:100%;display:block;object-fit:cover}
.status{position:absolute;top:12px;left:12px;background:var(--surface);color:var(--ink);padding:4px 10px;font-family:var(--mono);font-size:.72rem;display:flex;align-items:center;gap:6px}
.status i{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.card-body{padding:20px 20px 16px;flex:1}
.card-body h2{font-family:var(--display);font-stretch:112%;font-weight:700;font-size:1.45rem;line-height:1.15;margin:4px 0 8px;text-wrap:balance}
.card-body p{margin:0;color:var(--ink-2);font-size:.95rem}
body.s-b .card{border:3px solid var(--ink);border-radius:var(--radius);box-shadow:6px 6px 0 var(--ink);overflow:hidden}
body.s-b .card:hover{transform:translate(-3px,-3px);box-shadow:9px 9px 0 var(--accent)}
body.s-b .card-media{border-bottom:3px solid var(--ink)}
body.s-b .status{background:var(--pop);border:2px solid var(--ink);border-radius:999px;font-family:var(--body);font-weight:700;transform:rotate(-3deg)}
body.s-b .card-body h2{font-weight:800;font-size:1.6rem}
.cartouche{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--ink);font-family:var(--mono);font-size:.72rem}
.cartouche div{padding:8px 10px;border-right:1px solid var(--line);min-width:0}
.cartouche div:last-child{border-right:0}
.cartouche span{display:block;color:var(--ink-2);text-transform:uppercase;letter-spacing:.08em;font-size:.64rem}
.cartouche b{font-weight:500;overflow-wrap:anywhere}
body.s-b .cartouche{font-family:var(--body);font-size:.85rem;border-top:3px solid var(--ink)}
body.s-b .cartouche div{border-right:3px solid var(--ink)}
body.s-b .cartouche div:last-child{border-right:0}
body.s-b .cartouche b{font-weight:700}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.tag{font-size:.78rem;padding:3px 8px;border:1px solid var(--line);border-radius:var(--radius);color:var(--ink-2)}
.tag.m{border-color:var(--accent);color:var(--accent)}
body.s-b .tag.m{background:var(--accent);color:#fff;border:2px solid var(--ink);border-radius:999px;font-weight:700}
.empty{padding:40px;text-align:center;border:1px dashed var(--line);color:var(--ink-2)}

/* ---------- Page projet ---------- */
.crumb{padding-top:24px}
.crumb a{font-size:.9rem;color:var(--ink-2)}
.p-head{padding-block:20px 24px}
.p-head h1{font-family:var(--display);font-stretch:var(--stretch);font-weight:800;text-transform:uppercase;font-size:clamp(2rem,4.8vw,3.6rem);line-height:1;margin:6px 0 0;text-wrap:balance;max-width:22ch}
body.s-b .p-head h1{text-transform:none;letter-spacing:-.02em}
.p-head .sub{margin:12px 0 0;color:var(--ink-2);font-size:1.1rem;max-width:60ch}
.p-hero{aspect-ratio:21/9;background:var(--ph-a);position:relative;overflow:hidden}
.p-hero canvas,.p-hero img{width:100%;height:100%;display:block;object-fit:cover}
body.s-b .p-hero{border:3px solid var(--ink);border-radius:var(--radius)}
.ph-note{position:absolute;right:12px;bottom:12px;background:var(--surface);color:var(--ink-2);padding:4px 10px}
.p-cart{grid-template-columns:repeat(auto-fit,minmax(140px,1fr));border:1px solid var(--ink);border-top-width:2px;background:var(--surface);margin-top:12px}
.p-cart div{border-bottom:1px solid var(--line)}
body.s-b .p-cart{border:3px solid var(--ink);border-radius:var(--radius);overflow:hidden}
body.s-b .p-cart div{border-bottom:0}
.p-layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:clamp(24px,5vw,64px);padding-top:40px}
.p-main section{padding-bottom:40px}
.p-main h2{font-family:var(--display);font-stretch:112%;font-weight:700;font-size:1.5rem;margin:0 0 14px;display:flex;flex-wrap:wrap;align-items:baseline;gap:12px}
body.s-b .p-main h2{font-weight:800;font-size:1.7rem}
.p-main h2 .mono{color:var(--ink-2);font-weight:400}
.p-main p{max-width:65ch;margin:0 0 12px}
aside.p-side{display:flex;flex-direction:column;gap:28px;align-self:start;position:sticky;top:calc(env(safe-area-inset-top,0px) + 56px)}
aside.p-side h3{margin:0 0 8px}
aside.p-side ul{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:.93rem}
aside.p-side li{padding-bottom:6px;border-bottom:1px solid var(--line)}
body.s-b aside.p-side > div{border:3px solid var(--ink);border-radius:var(--radius);padding:14px}
body.s-b aside.p-side > div:first-child{background:var(--pop)}
body.s-b aside.p-side li{border-bottom:2px solid var(--ink)}
body.s-b aside.p-side li:last-child{border-bottom:0}
.alert{border-left:4px solid var(--pop);background:var(--surface);padding:12px 14px;margin:0 0 16px;font-size:.95rem;max-width:65ch}
body.s-b .alert{border:3px solid var(--ink);border-radius:var(--radius);background:var(--pop)}
/* frise */
.steps{list-style:none;margin:0;padding:0;border-left:2px solid var(--line)}
.steps li{position:relative;padding:0 0 18px 22px}
.steps li::before{content:"";position:absolute;left:-7px;top:6px;width:12px;height:12px;background:var(--bg);border:2px solid var(--line);border-radius:50%}
.steps li.done::before{background:var(--ink);border-color:var(--ink)}
.steps li.now::before{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 25%,transparent)}
.steps li.wait::before{background:var(--pop);border-color:var(--pop)}
.steps b{display:block}
.steps .mono{color:var(--ink-2)}
.pill{display:inline-block;margin-left:8px;padding:1px 8px;font-family:var(--mono);font-size:.68rem;vertical-align:2px;border-radius:var(--radius)}
.pill.now{background:var(--accent);color:var(--accent-ink)}
.pill.wait{background:var(--pop);color:#1A1E21}
body.s-b .steps{border-left:4px solid var(--ink)}
body.s-b .steps li::before{left:-11px;width:18px;height:18px;border:3px solid var(--ink)}
/* galerie */
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;align-items:start}
.gallery figure{margin:0}
.gallery button.ph-btn{display:block;width:100%;padding:0;border:0;background:none;cursor:zoom-in}
.gallery img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;background:var(--ph-a)}
.gallery .tall img{aspect-ratio:3/4}
.gallery .ph{aspect-ratio:4/3;background:repeating-linear-gradient(135deg,var(--ph-a) 0 12px,var(--ph-b) 12px 13px);display:grid;place-items:center;color:var(--ink-2);text-align:center;padding:8px}
.gallery figcaption{font-size:.82rem;color:var(--ink-2);padding-top:6px}
.gallery .k{display:inline-block;font-family:var(--mono);font-size:.66rem;text-transform:uppercase;letter-spacing:.1em;color:var(--accent);margin-right:6px}
body.s-b .gallery img,body.s-b .gallery .ph{border:3px solid var(--ink);border-radius:10px}
.quote-empty{border:1px dashed var(--line);padding:20px;color:var(--ink-2);font-size:.95rem}
.comp{display:grid;border-top:1px solid var(--line)}
.comp div{padding:10px 0;border-bottom:1px solid var(--line);font-size:.95rem}
body.s-b .comp{display:flex;flex-wrap:wrap;gap:8px;border:0}
body.s-b .comp div{border:2px solid var(--ink);border-radius:999px;padding:6px 14px;font-weight:700}
.docs{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.doc{border:1px solid var(--line);padding:14px;background:var(--surface);font-size:.92rem}
.doc .label{display:block;margin-bottom:4px}
body.s-b .doc{border:3px solid var(--ink);border-radius:var(--radius)}
/* lightbox */
dialog.lb{border:0;padding:0;background:transparent;max-width:min(96vw,1200px)}
dialog.lb::backdrop{background:rgba(10,12,14,.85)}
dialog.lb img{max-width:100%;max-height:82vh;display:block;margin:auto}
dialog.lb p{color:#F2F2F2;margin:8px 0 0;text-align:center}
dialog.lb button{position:absolute;top:8px;right:8px;font:600 .9rem/1 var(--body);background:#fff;color:#111;border:0;padding:8px 12px;border-radius:4px;cursor:pointer}

/* métiers */
.m-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));border-top:2px solid var(--ink)}
.m-item{padding:20px 20px 20px 0;border-bottom:1px solid var(--line)}
.m-item h3{font-family:var(--display);font-stretch:112%;font-size:1.2rem;margin:0 0 6px}
.m-item p{margin:0 0 10px;color:var(--ink-2);font-size:.93rem}
.m-item a{font-size:.88rem;color:var(--accent);font-weight:700}
.m-comp{list-style:none;margin:6px 0 12px;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.m-comp li{font-size:.8rem;padding:3px 10px;border:2px solid var(--ink);border-radius:999px;background:var(--surface);font-weight:700}
.wait-ph{width:100%;height:100%;display:grid;place-items:center;text-align:center;padding:16px;background:repeating-linear-gradient(135deg,var(--ph-a) 0 14px,var(--ph-b) 14px 16px);font-family:var(--display);font-weight:800;font-size:1.3rem;color:var(--accent)}
body.s-b .m-list{border:0;gap:16px}
body.s-b .m-item{border:3px solid var(--ink);border-radius:var(--radius);padding:18px}
body.s-b .m-item:nth-child(3n+1){background:#FFF4CC}
body.s-b .m-item:nth-child(3n+2){background:var(--ph-a)}
body.s-b .m-item:nth-child(3n){background:#FFE6E1}
.page-h{font-family:var(--display);font-stretch:var(--stretch);font-weight:800;text-transform:uppercase;font-size:clamp(2rem,4.5vw,3.2rem);line-height:1;margin:40px 0 12px}
body.s-b .page-h{text-transform:none}
.lead{color:var(--ink-2);max-width:62ch;margin:0 0 32px}


footer.site{margin-top:64px;padding-top:24px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;justify-content:space-between;gap:16px;font-size:.85rem;color:var(--ink-2)}

@media (max-width:860px){
  .hero,.p-layout{grid-template-columns:1fr}
  aside.p-side{position:static}
  .p-hero{aspect-ratio:16/10}
}
@media (max-width:520px){
  .cartouche{grid-template-columns:1fr 1fr}
  .cartouche div:nth-child(2n){border-right:0}
  .filters .count{margin-left:0}
  .stats b{font-size:1.6rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* =========== Ajouts site SEGPA (même jeu de jetons que l'atelier) =========== */
nav.main a.hab{background:var(--accent);color:var(--accent-ink);border-color:var(--ink)}
nav.main a.hab[aria-current="page"]{background:var(--pop);color:var(--ink)}
.subnav{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding-top:20px}
.subnav .label{margin-right:6px}
.subnav a{text-decoration:none;font-weight:700;font-size:.9rem;padding:6px 14px;border:2px solid var(--ink);border-radius:999px}
.subnav a[aria-current="page"]{background:var(--ink);color:var(--bg)}
.facts{border:3px solid var(--ink);border-radius:var(--radius);box-shadow:8px 8px 0 var(--accent);background:var(--surface);padding:6px 20px}
.facts div{display:flex;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:2px solid var(--ink);align-items:baseline}
.facts div:last-child{border-bottom:0}
.facts span{color:var(--ink-2)}
.facts b{font-family:var(--display);font-weight:800;font-size:1.15rem;text-align:right}
.hero .btns{display:flex;flex-wrap:wrap;gap:12px}
.btn{display:inline-block;padding:12px 20px;border:3px solid var(--ink);border-radius:999px;font-weight:700;text-decoration:none;background:var(--surface)}
.btn.pri{background:var(--pop)}
.btn:hover{transform:translate(-2px,-2px);box-shadow:4px 4px 0 var(--ink)}
.sec{padding-block:8px 36px}
.sec h2{font-family:var(--display);font-weight:800;font-size:1.7rem;margin:0 0 14px;text-wrap:balance}
.sec p{max-width:65ch;margin:0 0 12px}
.sec .m-list{grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr))}
.m-item.lnk{text-decoration:none;display:block}
.m-item.lnk:hover{transform:translate(-3px,-3px);box-shadow:6px 6px 0 var(--ink)}
.parcours{grid-template-columns:repeat(4,1fr)}
.parcours div{border-bottom:0}
.parcours b{font-family:var(--display);font-size:1.8rem;font-weight:800;display:block;color:var(--accent);text-transform:none}
.parcours p{font-family:var(--body);font-size:.9rem;margin:6px 0 0}
.bar{display:flex;height:12px;margin-top:10px;border:2px solid var(--ink);border-radius:999px;overflow:hidden}
.bar i{display:block;background:var(--accent)}.bar i.b{background:var(--pop)}
.team{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.doc h3{font-family:var(--display);font-size:1.1rem;margin:0 0 6px}

function drawMosaic(cv){
  const r=cv.getBoundingClientRect(),dpr=devicePixelRatio||1;if(!r.width)return;cv.width=r.width*dpr;cv.height=r.height*dpr;
  const c=cv.getContext("2d");c.scale(dpr,dpr);let s=11;const rnd=()=>(s=(s*9301+49297)%233280)/233280;
  c.fillStyle="#9AA1A6";c.fillRect(0,0,r.width,r.height);const size=Math.max(14,r.width/34);
  for(let y=0;y<r.height+size;y+=size){for(let x=0;x<r.width+size;x+=size){
    const dist=Math.hypot(x-r.width*.55,y-r.height*.5)/r.width,ring=Math.sin(dist*26)>0.55,g=ring?64+rnd()*40:28+rnd()*26;
    c.fillStyle=`rgb(${g},${g+5},${g+10})`;c.save();c.translate(x+rnd()*3,y+rnd()*3);c.rotate((rnd()-.5)*.12);
    c.fillRect(1.5,1.5,size-3-rnd()*3,size-3-rnd()*3);c.restore();}}
  c.strokeStyle="rgba(255,201,40,.9)";c.lineWidth=3;c.setLineDash([10,6]);c.beginPath();c.moveTo(r.width*.72,0);c.lineTo(r.width*.72,r.height);c.stroke();
  c.setLineDash([]);c.fillStyle="rgba(255,255,255,.92)";c.font=`500 ${Math.max(10,r.width/70)}px "IBM Plex Mono",monospace`;c.fillText("MÉRIDIEN",r.width*.72+8,22);
}
function drawPlan(cv){
  const r=cv.getBoundingClientRect(),dpr=devicePixelRatio||1;if(!r.width)return;cv.width=r.width*dpr;cv.height=r.height*dpr;
  const c=cv.getContext("2d");c.scale(dpr,dpr);const W=r.width,H=r.height;c.fillStyle="#1D3F86";c.fillRect(0,0,W,H);
  c.strokeStyle="rgba(255,255,255,.08)";const g=Math.max(12,W/40);
  for(let x=0;x<W;x+=g){c.beginPath();c.moveTo(x,0);c.lineTo(x,H);c.stroke()}for(let y=0;y<H;y+=g){c.beginPath();c.moveTo(0,y);c.lineTo(W,y);c.stroke()}
  const cx=W*.5,cy=H*.5,s=Math.min(W/2.3,H/1.25);c.strokeStyle="rgba(255,255,255,.9)";c.lineWidth=1.6;
  c.strokeRect(cx-s*.5,cy-s*.23,s,s*.13);c.beginPath();c.moveTo(cx-s*.04,cy-s*.42);c.lineTo(cx+s*.04,cy-s*.42);c.lineTo(cx+s*.03,cy+s*.42);c.lineTo(cx-s*.03,cy+s*.42);c.closePath();c.stroke();
  c.strokeRect(cx-s*.17,cy+s*.3,s*.34,s*.08);
}
function paint(){document.querySelectorAll("canvas[data-v]").forEach(cv=>cv.dataset.v==="mosaique"?drawMosaic(cv):drawPlan(cv))}

      <p>CAP : <b>${o.cap} élève${o.cap>1?"s":""}</b></p><p>Bac pro : <b>${o.bacpro} élève${o.bacpro>1?"s":""}</b></p>${o.autre?`<p>Autre : <b>${o.autre}</b></p>`:""}${o.details?`<p style="font-size:.88rem;color:var(--ink-2)">${esc(o.details)}</p>`:""}
      <div class="bar" aria-hidden="true"><i style="width:${pc(o.cap)}%"></i><i class="b" style="width:${pc(o.bacpro)}%"></i></div></div>`}).join("");
  const missing=ORIENTATIONS.some(o=>!ok(o));
  return `<h3 style="margin:24px 0 12px;font-family:var(--display)">Où vont nos élèves ?</h3><div class="docs">${cards}</div>${missing?"<div style=\"height:12px\"></div>"+todo("les nombres d'élèves orientés en CAP et en bac pro pour chaque année (chiffres globaux, sans noms)."):""}`;
}

function viewSegpa(){
  return `<h1 class="page-h">Qu'est-ce que la SEGPA ?</h1>
  <p class="lead">SEGPA signifie Section d'Enseignement Général et Professionnel Adapté. Elle fait partie du collège : les élèves partagent la cour, la cantine, la vie scolaire et certains projets avec les autres classes.</p>
  <section class="sec"><h2>Pour quels élèves ?</h2>
    <p>La SEGPA accueille des élèves qui ont des difficultés scolaires importantes et durables. L'enseignement suit les programmes du collège, avec des méthodes adaptées, plus de temps et un suivi individuel.</p>
    <p>L'orientation se décide en fin de CM2 ou en cours de 6e, après étude du dossier par une commission départementale et avec l'accord de la famille.</p></section>
  <section class="sec"><h2>Le parcours, de la 6e à la 3e</h2>

      <div><b>4e</b><span class="label">Ateliers</span><p>Entrée dans les ateliers professionnels et premier stage.</p></div>
      <div><b>3e</b><span class="label">Orientation</span><p>Stages, CFG et DNB, projet de poursuite vers un CAP.</p></div>
    </div></section>
  <section class="sec"><h2>Et après la 3e ?</h2>
    <p>La plupart des élèves de SEGPA poursuivent vers un CAP, en lycée professionnel ou en apprentissage. Le travail en atelier et les stages servent à choisir un métier en connaissance de cause.</p>
    <p>Les meilleurs élèves ont aussi la possibilité de demander un bac pro. Cette demande passe par un dossier, étudié par une commission qui valide ou non la demande. Le dossier ne garantit pas l'affectation : certains élèves l'obtiennent, d'autres non.</p>

    ${orientBlock()}
    <p style="margin-top:24px"><a class="btn pri" href="https://orientation91.fr" target="_blank" rel="noopener">Découvrir les CAP en Essonne →</a></p>

/* ---------- Routage ---------- */
function render(){
  let h=(location.hash||"#accueil").slice(1);
  if(h==="metiers")h="habitat-metiers";
  if(h==="has")h="has";
  if(PROJETS.some(x=>x.id===h))h="habitat-"+h;
  const v=document.getElementById("view");
  const pid=h.startsWith("habitat-")&&h!=="habitat-metiers"?h.slice(8):null;
  const p=pid&&PROJETS.find(x=>x.id===pid);
  let html;
  if(p)html=viewProjet(p);
  else if(h==="habitat-metiers")html=viewMetiers();
  else if(h==="has")html=viewHas();
  else if(h==="has-metiers")html=viewHasMetiers();
  else if(h==="habitat")html=viewHome();
  else if(h==="segpa")html=viewSegpa();
  else if(h==="equipe")html=viewEquipe();
  else if(h==="ateliers")html=viewAteliers();
  else if(h==="projets")html=viewProjets();
  else{h="accueil";html=viewAccueil()}
  v.innerHTML=html;
  const key=h.startsWith("habitat")?"habitat":h.startsWith("has")?"has":h;
  document.querySelectorAll("nav.main a").forEach(a=>{if(a.dataset.nav===key)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current")});
  requestAnimationFrame(paint);
  const f=document.getElementById("filters");
  if(f){f.addEventListener("change",e=>{F[e.target.name]=e.target.value;render()});const r=document.getElementById("reset");if(r)r.onclick=()=>{F={metier:"",annee:"",classe:"",comp:""};render()};}
  document.querySelectorAll("[data-metier]").forEach(a=>a.addEventListener("click",()=>{F={metier:a.dataset.metier,annee:"",classe:"",comp:""}}));
  if(p)document.querySelectorAll(".ph-btn").forEach(b=>b.onclick=()=>{const ph=p.photos[+b.dataset.i],d=document.getElementById("lb");
    document.getElementById("lb-img").src=ph.src;document.getElementById("lb-img").alt=ph.c;document.getElementById("lb-cap").textContent=ph.c;try{d.showModal()}catch(e){d.setAttribute("open","")}});
}
document.getElementById("lb-close").onclick=()=>document.getElementById("lb").close();
document.getElementById("lb").addEventListener("click",e=>{if(e.target.id==="lb")e.target.close()});

/* Photo absente du dossier photos/ : on affiche un repère au lieu d'une image cassée */
const PH_SVG="data:image/svg+xml;utf8,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250"><rect width="400" height="250" fill="#E8EEFF"/><path d="M0 0L400 250M400 0L0 250" stroke="#C9D6FF" stroke-width="2"/><text x="200" y="130" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700" fill="#1F4FD1">Photo à ajouter</text></svg>');
document.addEventListener("error",e=>{const t=e.target;if(t&&t.tagName==="IMG"&&!t.classList.contains("missing")){t.classList.add("missing");t.src=PH_SVG}},true);

document.body.classList.add("s-b");
addEventListener("hashchange",()=>{render();scrollTo(0,0)});
addEventListener("resize",()=>{clearTimeout(window._t);window._t=setTimeout(paint,150)});
render();

</script>
